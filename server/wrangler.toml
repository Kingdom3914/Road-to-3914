# Kingdom 3914 server (Cloudflare Worker "kingdom3914-api").
# Cloudflare deploys this folder automatically whenever it changes on GitHub.
# Secrets (DISCORD_APPS_WEBHOOK and any others) are set in the Cloudflare dashboard, never here.
name = "kingdom3914-api"
main = "worker.js"
compatibility_date = "2026-11-08"
workers_dev = true
keep_vars = true

# Discord tickets (public IDs only; the bot token, client secret and public key are set in the Cloudflare dashboard)
[vars]
DISCORD_CLIENT_ID = "1570555426179911932"
DISCORD_GUILD_ID = "1557486982920282192"
DISCORD_CATEGORY_ID = "1558210118271635476"
DISCORD_PANEL_CHANNEL_ID = "1557673575685689394"
DISCORD_STAFF_ROLES = "1557757079459070072,1557513988508483604"

# MGE/GH reminders for R4s and admins (checked every 15 minutes)
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "kingdom3914"
database_id = "530ad236-0599-4e9a-b0fa-dc6d3de04122"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kingdom3914-files"
